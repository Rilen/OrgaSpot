<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrgaSpot • Spotify Playlist Manager</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
  <header class="app-header">
    <div class="header-left">
      <img src="/assets/favicon.svg" alt="OrgaSpot" class="logo"/>
      <h1>OrgaSpot</h1>
    </div>
    <nav class="nav-tabs" id="navTabs"></nav>
    <div class="auth-section" id="authSection"></div>
  </header>

  <main class="app-main">
    <!-- Dashboard -->
    <section id="view-dashboard" class="view-section active">
      <div class="dashboard-grid" id="dashboardGrid"></div>
      <div class="quick-actions" id="quickActions"></div>
    </section>

    <!-- Playlists -->
    <section id="view-playlists" class="view-section">
      <div class="taxonomy-legend"></div>
      <div class="playlist-list" id="playlistList"></div>
    </section>

    <!-- Duplicates -->
    <section id="view-duplicates" class="view-section">
      <div class="duplicates-controls" id="duplicatesControls"></div>
      <div class="duplicates-list" id="duplicatesList"></div>
    </section>

    <!-- Lixeira -->
    <section id="view-lixeira" class="view-section">
      <div class="lixeira-header">
        <h2>🧹 Lixeira / Repetidas</h2>
        <button class="btn btn-ghost" id="emptyLixeiraBtn">Esvaziar Lixeira (Mensal)</button>
        <button class="btn btn-ghost" id="previewEmptyBtn">Preview (dry-run)</button>
      </div>
      <div class="lixeira-list" id="lixeiraList"></div>
    </section>

    <!-- Export -->
    <section id="view-export" class="view-section">
      <div class="export-panel" id="exportPanel"></div>
    </section>
  </main>

  <!-- Modal: Confirm -->
  <div class="modal-overlay" id="confirmModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 id="confirmTitle"></h3>
      <p id="confirmBody"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmCancel">Cancelar</button>
        <button class="btn btn-primary" id="confirmAction">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
